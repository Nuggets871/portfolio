# One canonical host: every www request goes to the apex domain.
# Google was listing www URLs as "alternate page with proper canonical tag"
# because they served the same page with a canonical pointing to the apex.
server {
    listen 80;
    server_name www.christopher-bondier.com;
    return 301 https://christopher-bondier.com$request_uri;
}

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Angular's client-side rendering shell must never be crawlable.
    location = /index.csr.html {
        return 404;
    }

    # Language URLs from the old i18n routing, removed from the site.
    location ~ ^/(en|fr|es)(/|$) {
        return 301 https://christopher-bondier.com/;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # HTML must never be cached aggressively (content/lastmod can change)
    location ~* \.html$ {
        # External requests for the index file are duplicates of "/". Internal
        # requests come from the index module resolving "/", so leave those be.
        if ($request_uri ~ "^/index\.html(\?|$)") {
            return 301 https://christopher-bondier.com/;
        }
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Hashed build assets can be cached forever
    location ~* \.(?:js|css|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Serve prerendered files and return a real 404 otherwise
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
