<nav class="navbar" [class.scrolled]="isScrolled" [class.menu-open]="isMenuOpen">
    <div class="nav-inner">
        <a class="nav-logo" routerLink="/" (click)="closeMenu()">
            <span class="logo-text">CB</span>
            <span class="logo-dot">.</span>
        </a>

        <div class="nav-links" [class.open]="isMenuOpen">
            <a class="nav-link" (click)="scrollTo('about')">{{ 'nav.about' | translate }}</a>
            <a class="nav-link" (click)="scrollTo('skills')">{{ 'nav.skills' | translate }}</a>
            <a class="nav-link" (click)="scrollTo('projects')">{{ 'nav.projects' | translate }}</a>
            <a class="nav-link" (click)="scrollTo('experience')">{{ 'nav.experience' | translate }}</a>
            <a class="nav-link" (click)="scrollTo('education')">{{ 'nav.education' | translate }}</a>
            <a class="nav-link" (click)="scrollTo('contact')">{{ 'nav.contact' | translate }}</a>
        </div>

        <div class="nav-actions">
            <div class="nav-lang" role="group" aria-label="Language">
                <a class="lang-link" routerLink="/" routerLinkActive="active"
                    [routerLinkActiveOptions]="{ exact: true }" hreflang="en" (click)="closeMenu()">EN</a>
                <a class="lang-link" routerLink="/fr" routerLinkActive="active" hreflang="fr"
                    (click)="closeMenu()">FR</a>
                <a class="lang-link" routerLink="/es" routerLinkActive="active" hreflang="es"
                    (click)="closeMenu()">ES</a>
            </div>

            <button class="menu-toggle" (click)="toggleMenu()" [class.open]="isMenuOpen" aria-label="Menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>
</nav>
