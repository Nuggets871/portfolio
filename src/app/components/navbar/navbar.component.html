<nav class="navbar" [class.scrolled]="isScrolled" [class.menu-open]="isMenuOpen">
    <div class="nav-inner">
        <a class="nav-logo" href="#hero" (click)="scrollTo('hero', $event)">
            <span class="logo-text">CB</span>
            <span class="logo-dot">.</span>
        </a>

        <div class="nav-links" id="primary-navigation" [class.open]="isMenuOpen">
            <a class="nav-link" href="#about" (click)="scrollTo('about', $event)">{{ 'nav.about' | translate }}</a>
            <a class="nav-link" href="#skills" (click)="scrollTo('skills', $event)">{{ 'nav.skills' | translate }}</a>
            <a class="nav-link" href="#projects" (click)="scrollTo('projects', $event)">{{ 'nav.projects' | translate }}</a>
            <a class="nav-link" href="#experience" (click)="scrollTo('experience', $event)">{{ 'nav.experience' | translate }}</a>
            <a class="nav-link" href="#education" (click)="scrollTo('education', $event)">{{ 'nav.education' | translate }}</a>
            <a class="nav-link" href="#contact" (click)="scrollTo('contact', $event)">{{ 'nav.contact' | translate }}</a>
        </div>

        <div class="nav-actions">
            <button class="menu-toggle" (click)="toggleMenu()" [class.open]="isMenuOpen" aria-label="Menu"
                aria-controls="primary-navigation" [attr.aria-expanded]="isMenuOpen">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </div>
</nav>
