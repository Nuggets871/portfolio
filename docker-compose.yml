services:
  web:
    build: .
    container_name: portfolio-web
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.portfolio.rule=Host(`christopher-bondier.com`,`www.christopher-bondier.com`)"
      - "traefik.http.routers.portfolio.entrypoints=websecure"
      - "traefik.http.routers.portfolio.tls=true"
      - "traefik.http.routers.portfolio.tls.certresolver=letsencrypt"
      - "traefik.http.services.portfolio.loadbalancer.server.port=80"
      - "traefik.http.routers.portfolio-redirect.rule=Host(`christopher-bondier.com`,`www.christopher-bondier.com`)"
      - "traefik.http.routers.portfolio-redirect.entrypoints=web"
      - "traefik.http.routers.portfolio-redirect.middlewares=portfolio-https"
      - "traefik.http.middlewares.portfolio-https.redirectscheme.scheme=https"
networks:
  web:
    external: true